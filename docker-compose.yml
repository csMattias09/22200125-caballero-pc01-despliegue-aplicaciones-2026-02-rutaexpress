name: rutaexpress

# Variables comunes a las tres replicas: misma imagen, misma base, distinto INSTANCE_ID.
x-app-env: &app-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:?Definir DB_USER en .env}
  DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
  DB_NAME: ${DB_NAME:?Definir DB_NAME en .env}
  PORT: 3000
  PERMITIR_DEMORA: ${PERMITIR_DEMORA:-false}

x-app: &app
  image: ${DOCKERHUB_USER:-csmattias}/envios-app:${APP_VERSION:-1.0.0}
  build: .
  restart: unless-stopped
  # Puerto 3000 solo en la red interna: no se publica al host.
  expose:
    - "3000"
  depends_on:
    db:
      condition: service_healthy

services:
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "15432:5432" # DBeaver: localhost:15432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80" # Unico punto de entrada: http://localhost:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Logs de Nginx en el host: sobreviven a la recreacion del contenedor.
      - ./logs/nginx:/var/log/nginx/rutaexpress
    depends_on:
      - app1
      - app2
      - app3

volumes:
  pg_data:
