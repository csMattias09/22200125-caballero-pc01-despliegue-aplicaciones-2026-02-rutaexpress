# DNS interno de Docker: permite resolver app1..app3 en tiempo de ejecucion
# (si una replica se detiene y vuelve, Nginx la reincorpora sin reiniciarse).
resolver 127.0.0.11 valid=5s ipv6=off;

# Log de acceso en JSON (sin body ni datos personales).
log_format acceso_json escape=json
  '{"fecha":"$time_iso8601","msec":"$msec","request_id":"$request_id",'
  '"ip_cliente":"$remote_addr","metodo":"$request_method","ruta":"$uri",'
  '"status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
  '"tiempo_s":"$request_time"}';

# Limite por IP solo para POST: con clave vacia (otros metodos) Nginx no aplica el limite.
map $request_method $limite_post_por_ip {
  POST    $binary_remote_addr;
  default "";
}
# 2 solicitudes por segundo por IP.
limit_req_zone $limite_post_por_ip zone=envios_post:10m rate=2r/s;

# Rechazos por exceso de trafico: se guardan aparte para poder consultarlos.
map $status $es_rechazo_429 {
  429     1;
  default 0;
}
log_format rechazo_json escape=json
  '{"fecha":"$time_iso8601","msec":"$msec","request_id":"$request_id",'
  '"ip_cliente":"$remote_addr","metodo":"$request_method","ruta":"$uri","status":$status}';

upstream envios_backend {
  zone envios_backend 64k;
  # Round-robin entre las tres replicas; si una falla se marca como no disponible 10 s.
  server app1:3000 resolve max_fails=1 fail_timeout=10s;
  server app2:3000 resolve max_fails=1 fail_timeout=10s;
  server app3:3000 resolve max_fails=1 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/rutaexpress/access.log acceso_json;
  access_log /dev/stdout acceso_json;
  access_log /var/log/nginx/rutaexpress/rechazos_429.log rechazo_json if=$es_rechazo_429;

  # Cabeceras comunes hacia el backend.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Identificador unico por solicitud: enlaza el log de Nginx con la tabla intentos.
  proxy_set_header X-Request-ID $request_id;
  add_header X-Request-ID $request_id always;

  # Si una replica no acepta la conexion, se prueba con la siguiente.
  # Nginx no reenvia un POST que ya llego a una replica (evita duplicar operaciones).
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 3;

  # POST /envios: rafaga adicional de 4 procesada de inmediato (nodelay); el exceso recibe 429
  # sin llegar a la aplicacion.
  location = /envios {
    limit_req zone=envios_post burst=4 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;
    proxy_pass http://envios_backend;
  }

  location / {
    proxy_pass http://envios_backend;
  }
}
